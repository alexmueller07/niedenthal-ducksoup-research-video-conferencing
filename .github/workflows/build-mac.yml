name: Build macOS app

# Builds a universal (Intel + Apple Silicon) macOS app of Lab Video Call on a
# GitHub-hosted macOS runner, so it can be built without owning a Mac.
#
# Signed with a free Apple ID personal-team certificate (MAC_CSC_LINK /
# MAC_CSC_KEY_PASSWORD secrets) so the code identity stays stable across
# builds — this stops macOS re-prompting for camera/mic access on every
# rebuild. It's still not notarized (that needs a paid Developer ID), so on
# first launch the tester must right-click the app -> Open (see the email
# instructions), because macOS Gatekeeper blocks unnotarized apps opened by
# double-click.

on:
  workflow_dispatch: # lets you trigger a build manually from the Actions tab
  push:
    branches: [main, ci/macos-build]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import signing certificate
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Build macOS app (universal)
        run: npm run build:mac

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lab-video-call-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
